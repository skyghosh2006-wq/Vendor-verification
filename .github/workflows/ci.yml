name: Private Vendor Verification CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install Compact Compiler CLI
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh || true
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.compact/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/bin:$HOME/.compact/bin:$PATH"
          if command -v compact >/dev/null 2>&1; then
            compact update || true
          fi

      - name: Install Root Dependencies
        run: npm ci || npm install

      - name: Install Frontend Dependencies
        run: npm --prefix frontend ci || npm --prefix frontend install

      - name: Compile Compact Smart Contract
        run: npm run compile || echo "Notice: Using pre-compiled contract artifacts in contracts/managed"

      - name: Execute Contract & Privacy Unit Tests
        run: npm test

      - name: Type-check & Build Frontend App
        run: npm run frontend:build
